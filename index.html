<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0a1a" />

    <!-- 아이콘 파일은 다 있었는데 연결이 하나도 없어서 탭에도 홈화면에도 안 나왔다. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon_32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon_64.png" />
    <link rel="apple-touch-icon" href="/assets/apple_touch_icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- 홈화면에서 실행했을 때 브라우저 UI 없이 전체화면으로 뜨게 한다 -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CAROM" />

    <!--
      Orbitron  — 숫자·영문 UI. 로고의 네온 사이파이 톤과 같은 계열.
      Gothic A1 — 한글 본문. Orbitron에는 한글이 없어 섞어 쓴다.
      폰트가 안 실려도 fallback으로 읽히게 CSS에 시스템 폰트를 남겨둔다.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Gothic+A1:wght@400;700;800&display=swap"
      rel="stylesheet"
    />

    <title>CAROM</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
